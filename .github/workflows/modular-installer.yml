name: Modular installer validation
on:
  push:
    branches: [fix/canonical-staging-discovery]
  pull_request:
  workflow_dispatch:
jobs:
  static-and-unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Bash syntax and ShellCheck
        run: |
          bash -n scripts/install-pagonia-new.sh
          bash -n scripts/install-pagonia-gptk4b3.sh
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck scripts/install-pagonia-new.sh
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: New orchestration, process and graphics tests
        run: |
          python3 tests/test-new-installer.py
          python3 tests/test-pagonia-process.py
          python3 tests/test-new-graphics.py
          python3 tests/test-new-flow.py
      - name: Existing component regression tests
        run: |
          for test in tests/test-*.py; do
            case "$test" in
              tests/test-new-installer.py|tests/test-pagonia-process.py|tests/test-new-graphics.py) continue ;;
            esac
            echo "Testing $test"
            python3 "$test"
          done
      - name: Patch whitespace
        run: git diff --check origin/main...HEAD
